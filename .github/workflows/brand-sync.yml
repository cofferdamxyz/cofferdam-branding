# Rebuilds the brand and opens a pull request on every consumer when its files change.
# Runs on every push to main (a token, asset or guideline edit) and once a day, so a
# seasonal overlay starts and ends on its own date without anyone pushing.
#
# Setup (once): add a repository secret BRAND_SYNC_TOKEN — a fine-grained PAT (or GitHub
# App token) with Contents + Pull requests: read/write on cofferdamxyz/cofferdam-app and
# cofferdamxyz/cofferdam-pages.
name: brand-sync

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 3 * * *' # 03:07 UTC daily (00:07 in São Paulo)
  workflow_dispatch:
    inputs:
      season:
        description: 'Force a season id (or "none") for this run'
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build + validate
        run: node scripts/build.mjs ${{ inputs.season && format('--season={0}', inputs.season) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: brand-dist
          path: |
            dist/
            assets/
            fonts/

  sync:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: [cofferdam-app, cofferdam-pages]
    steps:
      - uses: actions/checkout@v4
        with:
          path: branding
      - uses: actions/download-artifact@v4
        with:
          name: brand-dist
          path: branding
      - uses: actions/checkout@v4
        with:
          repository: cofferdamxyz/${{ matrix.consumer }}
          token: ${{ secrets.BRAND_SYNC_TOKEN }}
          path: ${{ matrix.consumer }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy generated files
        working-directory: branding
        run: |
          only=$([ "${{ matrix.consumer }}" = "cofferdam-app" ] && echo app || echo pages)
          node scripts/sync.mjs --only=$only --app=../cofferdam-app --pages=../cofferdam-pages --write
      - name: Read build stamp
        id: stamp
        working-directory: branding
        run: |
          echo "season=$(node -p "require('./dist/brand.resolved.json').season || 'none'")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Open / update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          path: ${{ matrix.consumer }}
          token: ${{ secrets.BRAND_SYNC_TOKEN }}
          branch: brand-sync/auto
          delete-branch: true
          commit-message: 'brand: sync from cofferdam-branding@${{ steps.stamp.outputs.sha }} (season: ${{ steps.stamp.outputs.season }})'
          title: 'brand: sync from cofferdam-branding@${{ steps.stamp.outputs.sha }}'
          labels: brand-sync
          body: |
            Generated by `cofferdam-branding/.github/workflows/brand-sync.yml`.

            - Source: cofferdamxyz/cofferdam-branding@${{ steps.stamp.outputs.sha }}
            - Active season: **${{ steps.stamp.outputs.season }}**

            Only generated files changed (`brand.generated.*`, `brand.resolved.json`, wallpapers, textures, fonts).
            Agents: follow the `cofferdam-brand-sync` skill in cofferdam-branding to wire any new token into the UI.
