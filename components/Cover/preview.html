<!-- @dsCard height=288 -->
<style>
  html, body { margin: 0; background: var(--bg); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); }
  /* one stone texture: Obsidian in dark, Marble in light (the wallpaper pair) */
  .stone { position: absolute; left: 528px; top: 24px; width: 480px; height: 240px; border-radius: var(--radius-xxl);
           background: url('{{asset:assets/textures/obsidian.webp}}') center / cover; box-shadow: inset 0 0 0 1px var(--card-border); }
  [data-theme="light"] .stone { background-image: url('{{asset:assets/textures/marble.webp}}'); }
  .art { position: absolute; inset: 0; }
  .g0 { stop-color: var(--splash-gradient-from); }
  .g1 { stop-color: var(--splash-gradient-to); }
  .m-a-stem { fill: var(--mark-a-stem); }
  .m-a-arm { fill: var(--mark-a-arm); }
  .m-b-stem { fill: var(--mark-b-stem); }
  .m-b-arm { fill: var(--mark-b-arm); }
  .edge { fill: none; stroke: var(--chain-tile-edge); stroke-width: 1; }
  .proof { fill: var(--accent); stroke: var(--bg); stroke-width: 6; }
  .tick { fill: none; stroke: var(--bg); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .name { position: absolute; left: 48px; bottom: 76px; max-width: 440px; margin: 0;
          font-family: var(--font-sans); font-weight: 700; font-size: 80px; line-height: .92;
          letter-spacing: -2.4px; color: var(--fg); }
  .tag { position: absolute; left: 48px; bottom: 48px; max-width: 440px; margin: 0;
         font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 500; color: var(--fg-muted); }
</style>
<div class="cover">
  <div class="stone"></div>

      blocks:  stone slab 480×240 (radius-xxl, bleeds off the right) · app-icon tile 200×200 · proof badge ⌀60
      arrange: the tile sits on the stone like the icon on a wallpaper; one verified tick overlaps the tile's lower-right corner
      pattern: none — one v5 mark (toned, inside its tile), one texture (Obsidian / Marble), one proof fragment (accent tick, no words)
      rules:   README "Two blues, two jobs" — identity on the tile, accent on the tick; "Light mode" — the colour mark is inside its tile, so the two may share the view
      scales:  space-xl (24px) inset of the slab, mark canvas at 94% of the tile (ink ≈ 70%, as in the designer's icon), tile corner 22.5%, badge ring = bg like the Avatar badge
