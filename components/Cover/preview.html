<!-- @dsCard height=288 -->
<style>
  html, body { margin: 0; background: var(--bg); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); }
  /* one stone texture as the whole ground: Obsidian in dark, Marble in light, at the website's texture opacity,
     eased back under the name so the type sits on a calm field */
  .stone { position: absolute; inset: 0; background: url('{{asset:assets/textures/obsidian.webp}}') center / cover;
           opacity: var(--opacity-texture-dark);
           -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.7) 45%, #000 75%);
                   mask-image: linear-gradient(90deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.7) 45%, #000 75%); }
  [data-theme="light"] .stone { background-image: url('{{asset:assets/textures/marble.webp}}'); opacity: var(--opacity-texture-light); }
  .art { position: absolute; inset: 0; }
  .g0 { stop-color: var(--splash-gradient-from); }
  .g1 { stop-color: var(--splash-gradient-to); }
  .m-a-stem { fill: var(--mark-a-stem); }
  .m-a-arm { fill: var(--mark-a-arm); }
  .m-b-stem { fill: var(--mark-b-stem); }
  .m-b-arm { fill: var(--mark-b-arm); }
  /* light: the greyscale icon tile (CofferdamMark tile="mono": tile-mono-* + mark-mono-*) */
  [data-theme="light"] .g0 { stop-color: var(--tile-mono-from); }
  [data-theme="light"] .g1 { stop-color: var(--tile-mono-to); }
  [data-theme="light"] .m-a-stem { fill: var(--mark-mono-a-stem); }
  [data-theme="light"] .m-a-arm { fill: var(--mark-mono-a-arm); }
  [data-theme="light"] .m-b-stem { fill: var(--mark-mono-b-stem); }
  [data-theme="light"] .m-b-arm { fill: var(--mark-mono-b-arm); }
  .edge { fill: none; stroke: var(--chain-tile-edge); stroke-width: 1; }
  .name { position: absolute; left: 48px; bottom: 76px; max-width: 440px; margin: 0;
          font-family: var(--font-sans); font-weight: 700; font-size: 80px; line-height: .92;
          letter-spacing: -2.4px; color: var(--fg); }
  .tag { position: absolute; left: 48px; bottom: 48px; max-width: 440px; margin: 0;
         font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 500; color: var(--fg-muted); }
</style>
<div class="cover">
  <div class="stone"></div>
  <svg class="art" viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!--
      blocks:  full-bleed stone ground (opacity-texture-dark / -light, faded under the name) · app-icon tile 200×200
      arrange: the tile sits on the stone like the icon on a wallpaper, beside the name and statement
      pattern: none — one v5 mark (inside its tile; {{mark-polygons}} is filled in by build.mjs from the official geometry), one texture (Obsidian / Marble)
      rules:   dark: the navy identity tile; light: the greyscale tile (mark-mono-*). No proof elements on a brand moment ("Light mode: brand art and proof stay apart")
      scales:  mark canvas at 94% of the tile (ink ≈ 70%, as in the designer's icon), tile corner 22.5%
    -->
    <defs><linearGradient id="cv-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="g0"/><stop offset="1" class="g1"/></linearGradient></defs>
    <rect x="600" y="44" width="200" height="200" rx="45" fill="url(#cv-g)"/>
    <rect class="edge" x="600.5" y="44.5" width="199" height="199" rx="44.5"/>
    <svg x="606" y="50" width="188" height="188" viewBox="0 0 1024 1024">{{mark-polygons}}</svg>
  </svg>
  <h1 class="name">Cofferdam</h1>
  <p class="tag">Work that proves itself.</p>
</div>
<script>/* static cover */</script>
